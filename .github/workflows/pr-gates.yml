name: pr-gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: card-pr-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: card-make
    steps:
      - name: Checkout card workspace
        uses: actions/checkout@v7
        with:
          path: card-make
          fetch-depth: 0
          # Formal trusted-media QC rehashes and replays exact MP3 bytes.
          # Materialize LFS here so a formal evidence PR can satisfy its required gate.
          lfs: true

      - name: Checkout product authority
        uses: actions/checkout@v7
        with:
          repository: LENKIN233/softbook_cet
          ref: main
          path: softbook_cet
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.11.0"

      - name: Validate contracts
        run: |
          python3 scripts/test_trusted_model_review.py
          node scripts/validate_harness.mjs
          node scripts/validate_audio_qc.mjs
          node --test scripts/test_validate_audio_qc_model.mjs
          node scripts/validate_audio_lfs.mjs
          node --test scripts/test_model_acceptance.mjs
          node --test scripts/test_card_integrity.mjs
          node --test scripts/test_validate_pr_scope.mjs
          node --test scripts/test_validate_delivery_record.mjs
          node --test scripts/test_audio_technical_audit.mjs
          node --test scripts/test_audio_perceptual_worklist.mjs
          node --test scripts/test_build_audio_qc_drafts.mjs
          python3 scripts/test_run_trusted_media_review.py
          node --test scripts/test_build_trusted_media_run_receipt.mjs
          node --test scripts/test_manage_controlled_pilot_approval.mjs
          git diff --check

  content-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: card-make
    steps:
      - name: Checkout card workspace
        uses: actions/checkout@v7
        with:
          path: card-make
          fetch-depth: 0
          # Card and audit validation does not consume MP3 bytes. Retaining
          # pointers keeps the content gate available when LFS downloads are
          # temporarily quota-limited.
          lfs: false

      - name: Checkout product authority
        uses: actions/checkout@v7
        with:
          repository: LENKIN233/softbook_cet
          ref: main
          path: softbook_cet
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.11.0"

      - name: Validate cards and current audit
        run: |
          node scripts/validate_cards.mjs --report-path "$RUNNER_TEMP/card-validation.json"
          node scripts/audit_card_quality.mjs --report-path "$RUNNER_TEMP/card-quality-audit.json"

      - name: Validate pull request scope
        if: github.event_name == 'pull_request'
        run: node scripts/validate_pr_scope.mjs --base "origin/${{ github.base_ref }}" --head HEAD

  approval-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: card-make
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: card-make
          fetch-depth: 0

      - name: Validate approval boundary
        if: github.event_name == 'pull_request'
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/validate_delivery_boundary.mjs --base "origin/${{ github.base_ref }}" --head HEAD

  delivery-record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: card-make
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: card-make
          fetch-depth: 0

      - name: Validate handoff record
        if: github.event_name == 'pull_request'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
          DELIVERY_PR_NUMBER: ${{ github.event.pull_request.number }}
          DELIVERY_PR_URL: ${{ github.event.pull_request.html_url }}
          DELIVERY_PR_STATE: ${{ github.event.pull_request.state }}
          DELIVERY_PR_MERGED: ${{ github.event.pull_request.merged }}
          DELIVERY_PR_DRAFT: ${{ github.event.pull_request.draft }}
          DELIVERY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DELIVERY_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          DELIVERY_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          DELIVERY_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          DELIVERY_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
        run: node scripts/validate_delivery_record.mjs --base "origin/${{ github.base_ref }}" --head "${{ github.event.pull_request.head.sha }}"

  repo-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: card-make
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: card-make
          fetch-depth: 0

      - name: Validate repository health
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/test_report_repo_health.mjs
          node scripts/validate_candidate_review_queue.mjs --self-test
          if [ "$EVENT_NAME" = "schedule" ]; then
            node scripts/report_repo_health.mjs --full-tree --remote --strict --expected-max-worktrees 1 --expected-max-stashes 0 --require-upstreams --output "$RUNNER_TEMP/repository-health.json"
            node scripts/validate_candidate_review_queue.mjs --required --require-nonempty --verify-remote
          elif git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            node scripts/report_repo_health.mjs --base "$BASE_SHA" --strict --expected-max-worktrees 1 --expected-max-stashes 0 --require-upstreams --output "$RUNNER_TEMP/repository-health.json"
            node scripts/validate_candidate_review_queue.mjs
          else
            node scripts/report_repo_health.mjs --strict --expected-max-worktrees 1 --expected-max-stashes 0 --require-upstreams --output "$RUNNER_TEMP/repository-health.json"
            node scripts/validate_candidate_review_queue.mjs
          fi
