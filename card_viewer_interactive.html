                            <div class="card-back-text">${escapeHtml(back.text || '（无背面内容）')}</div>
                            ${back.explanation ? `<div class="card-explanation">${escapeHtml(back.explanation)}</div>` : ''}
                            ${renderBackReviewPanel(card)}
                        </div>
                        <div class="card-actions">
                            <div style="text-align: center;">
                                <button class="flip-btn">📖 返回题面</button>
                            </div>
                            ${renderFeedbackButtons()}
                        </div>
                    </div>
                `;
            }

            const correctItems = items.filter(it => it.is_correct);
            // Strip highlight_ranges for T4 front — highlights would reveal the correct items
            const frontNoHl = Object.assign({}, front, { highlight_ranges: [] });
            const displayItems = items
                .map((item, index) => ({ item, sortKey: `${(index * 37) % 17}-${(item.text || '').length % 11}-${index}` }))
                .sort((left, right) => left.sortKey.localeCompare(right.sortKey))
                .map(entry => entry.item);
            return `
                <div class="interactive-card">
                    <div class="card-phase">正面（结构拆解）</div>
                    <div class="card-content">
                        ${renderFrontPanels(frontNoHl, card)}
                        <div style="font-size: 12px; color: var(--text-muted); margin-top: 8px; text-align: left; width: 100%;">点击句中需要消除的片段</div>
                        <div class="eliminable-grid">
                            ${displayItems.map((item) => `
                                <div class="eliminable-item" data-correct="${item.is_correct ? 'true' : 'false'}">
                                    <span>${escapeHtml(item.text)}</span>
                                </div>
                            `).join('')}
                        </div>
                        <div class="eliminate-status" id="eliminateStatus" data-target="${correctItems.length}">尚未消除任何片段</div>
                    </div>
                    <div class="card-actions">
                        <div style="text-align: center;">
                            <button class="flip-btn">查看解析 →</button>
                        </div>
                        ${renderFeedbackButtons()}
                    </div>
                </div>
            `;
        }

        function renderT5(card) {
            const front = card.front_content || {};
            const back = card.back_content || {};
            const isFlipped = cardState.flipped || false;
            const hintOpen = cardState.hintOpen || false;

            if (isFlipped) {
                return `

        function renderDefault(card) {

        // Interaction handlers
        function toggleFlip() {
            cardState.flipped = !cardState.flipped;
            globalAudio.pause();
            renderCard();
        }

        function selectOption(btn, idx, isCorrect) {
            document.querySelectorAll('.option-btn').forEach(b => {
                b.classList.remove('selected', 'correct', 'incorrect');
                b.disabled = false;
            });
            btn.classList.add('selected');
            btn.classList.add(isCorrect ? 'correct' : 'incorrect');
            document.querySelectorAll('.option-btn').forEach(b => {
                if (b !== btn) b.disabled = true;
            });

            cardState.selectedOptionIndex = idx;
            cardState.optionIsCorrect = !!isCorrect;
            cardState.flipped = true;
            globalAudio.pause();
            renderCard();
        }

        function toggleEliminate(el) {
            // Only toggle neutral strikethrough — no color feedback until 查看解析
            if (el.classList.contains('eliminated')) {
                el.classList.remove('eliminated');
            } else {
                el.classList.add('eliminated');
            }
            updateEliminateStatus();
        }

        function updateEliminateStatus() {
            const status = document.getElementById('eliminateStatus');
            if (!status) return;
            const total = Number(status.getAttribute('data-target') || 0);
            const eliminated = document.querySelectorAll('.eliminable-item.eliminated').length;
            if (eliminated === 0) {
                status.textContent = '尚未消除任何片段';
            } else {
                status.textContent = `已消除 ${eliminated} 个片段`;
            }
        }

        function checkAndFlipT4() {
            // Reveal correct/incorrect/missed on each item, then flip
            document.querySelectorAll('.eliminable-item').forEach(item => {
                const isCorrect = item.getAttribute('data-correct') === 'true';
                const isEliminated = item.classList.contains('eliminated');
                item.classList.remove('eliminated');
                if (isCorrect && isEliminated) {
                    item.classList.add('correct-eliminated');
                } else if (!isCorrect && isEliminated) {
                    item.classList.add('error-eliminated');
                } else if (isCorrect && !isEliminated) {
                    item.classList.add('missed'); // should have eliminated but didn't
                }
            });
            // Brief pause so user sees the result, then flip
            setTimeout(() => toggleFlip(), 600);
        }

        function recordT2Click() {
            const card = filteredCards[currentCardIdx];
            const windowMs = Array.isArray(card.time_window_ms) ? card.time_window_ms : [];
            const clickedMs = Math.floor((globalAudio.currentTime || 0) * 1000);
            const isCorrect = windowMs.length === 2 && clickedMs >= windowMs[0] && clickedMs <= windowMs[1];

            cardState.t2ClickedMs = clickedMs;
            cardState.t2IsCorrect = isCorrect;
            cardState.flipped = true;
            globalAudio.pause();
            renderCard();
        }

        function startT3Hold() {
            cardState.t3HoldStart = performance.now();
        }

        function finishT3Hold() {
            const card = filteredCards[currentCardIdx];
            const targetMs = Number(card.target_duration_ms) || 0;
            const start = Number(cardState.t3HoldStart) || performance.now();
            const heldMs = Math.max(0, Math.floor(performance.now() - start));
            const tolerance = Math.max(650, targetMs * 0.35);

            cardState.t3HeldMs = heldMs;
            cardState.t3IsCorrect = targetMs > 0 ? Math.abs(heldMs - targetMs) <= tolerance : heldMs > 0;
            cardState.flipped = true;
            delete cardState.t3HoldStart;
            globalAudio.pause();
            renderCard();
        }

        function toggleHintLayer() {
            cardState.hintOpen = !cardState.hintOpen;
            renderCard();
        }

        function respondT7(answer) {
            const card = filteredCards[currentCardIdx];
            const expected = card.correct_answer;
            const normalizedExpected = typeof expected === 'boolean'
                ? expected
                : String(expected).toLowerCase() === 'true';
            const isCorrect = normalizedExpected === answer;
            cardState.t7Answer = answer;
            cardState.t7IsCorrect = isCorrect;
            cardState.flipped = true;
            globalAudio.pause();
            renderCard();
        }

        function countT6Blanks(text) {
            return (String(text || '').match(/\{\{blank\}\}/g) || []).length;
        }

        function renderT6Text(text, selections) {
            const source = String(text || '');
            const chosen = Array.isArray(selections) ? selections : [];
            const regex = /\{\{blank\}\}/g;
            let cursor = 0;
            let index = 0;
            let match;
            let html = '';

            while ((match = regex.exec(source)) !== null) {
                html += escapeHtml(source.slice(cursor, match.index)).replace(/\n/g, '<br>');
                const selectedWord = chosen[index];
                html += selectedWord
                    ? `<span style="display: inline-block; min-width: 62px; padding: 2px 8px; margin: 0 3px; border-radius: 999px; background: rgba(0, 129, 212, 0.18); border: 1px solid rgba(0, 212, 255, 0.35); color: var(--accent); text-align: center;">${escapeHtml(selectedWord)}</span>`
                    : `<span style="display: inline-block; min-width: 62px; padding: 2px 8px; margin: 0 3px; border-bottom: 2px solid rgba(255,255,255,0.28); color: var(--text-muted); text-align: center;">____</span>`;
                cursor = match.index + match[0].length;
                index += 1;
            }

            html += escapeHtml(source.slice(cursor)).replace(/\n/g, '<br>');
            return html || '（无题面内容）';
        }

        function selectT6Word(word) {
            const card = filteredCards[currentCardIdx];
            const blankCount = countT6Blanks((card.front_content || {}).text || '');
            const targetCount = blankCount || ((Array.isArray(card.blank_answers) && card.blank_answers.length) ? card.blank_answers.length : 0);
            const currentSelections = Array.isArray(cardState.t6Selections) ? [...cardState.t6Selections] : [];

            if (currentSelections.length >= targetCount) {
                return;
            }

            currentSelections.push(word);
            cardState.t6Selections = currentSelections;

            if (currentSelections.length >= targetCount && targetCount > 0) {
                const answers = Array.isArray(card.blank_answers) ? card.blank_answers : [];
                cardState.t6IsCorrect = answers.length === currentSelections.length && currentSelections.every((value, idx) => {
                    return String(value || '').trim().toLowerCase() === String(answers[idx] || '').trim().toLowerCase();
                });
                cardState.flipped = true;
            }

            renderCard();
        }

        function resetT6() {
            delete cardState.t6Selections;
            delete cardState.t6IsCorrect;
            cardState.flipped = false;
            renderCard();
        }

        function selectT8Option(btn, idx, isCorrect) {
            document.querySelectorAll('.t8-option-btn').forEach(button => {
                button.classList.remove('selected', 'correct', 'incorrect');
                button.disabled = false;
            });

            btn.classList.add('selected');
            btn.classList.add(isCorrect ? 'correct' : 'incorrect');
            document.querySelectorAll('.t8-option-btn').forEach(button => {
                if (button !== btn) button.disabled = true;
            });

            cardState.t8SelectedIndex = idx;
            cardState.t8IsCorrect = !!isCorrect;
            cardState.flipped = true;
            renderCard();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = String(text || '');
            return div.innerHTML;
        }

        function splitFrontText(text) {
            const raw = String(text || '').trim();
            if (!raw) return { context: '', task: '' };
            const parts = raw.split(/\n\n+/).map(s => s.trim()).filter(Boolean);
            if (parts.length === 1) {
                const single = parts[0];
                const taskStart = single.search(/(请选择|选出|判断|是否|点击|消除|填空|选择|根据|推断|True\/False|\?|？)/);
                if (taskStart > 0) {
                    return {
                        context: single.slice(0, taskStart).trim(),
                        task: single.slice(taskStart).trim()
                    };
                }
                return { context: single, task: '' };
            }
            return {
                context: parts[0],
                task: parts.slice(1).join('\n\n')
            };
        }

        function isMobileViewport() {
            return window.matchMedia('(max-width: 768px)').matches;
        }

        function renderAdaptiveBlock(title, innerHtml) {
            return `
                <details class="adaptive-details">
                    <summary>${escapeHtml(title || '更多')}</summary>
                    <div class="adaptive-body">${innerHtml}</div>
                </details>
            `;
        }

        function normalizeRanges(ranges, textLength) {
            if (!Array.isArray(ranges)) return [];
            return ranges
                .filter(r => Array.isArray(r) && r.length === 2)
                .map(r => [Math.max(0, Number(r[0]) || 0), Math.min(textLength, Number(r[1]) || 0)])
                .filter(r => r[1] > r[0])
                .sort((a, b) => a[0] - b[0]);
        }

        function renderContextWithHighlights(text, ranges) {
            const source = String(text || '');
            if (!source) return '（无语境内容）';
            const safeText = escapeHtml(source);
            const normalized = normalizeRanges(ranges, source.length);
            if (!normalized.length) {
                return safeText.replace(/\n/g, '<br>');
            }

            let html = '';
            let cursor = 0;
            for (const [start, end] of normalized) {
                if (start > cursor) {
                    html += escapeHtml(source.slice(cursor, start));
                }
                html += `<span class="hl">${escapeHtml(source.slice(start, end))}</span>`;
                cursor = end;
            }
            if (cursor < source.length) {
                html += escapeHtml(source.slice(cursor));
            }
            return html.replace(/\n/g, '<br>');
        }

        function renderAudioPlayer(card) {
            const audio = (card && card.audio) || {};
            if (!audio.url) return '';

            const isCurrent = currentAudioCardId === card.card_id;
            const isPlaying = isCurrent && !globalAudio.paused;
            const currentMs = isCurrent ? Math.floor((globalAudio.currentTime || 0) * 1000) : 0;
            const totalMs = audio.duration_ms || Math.floor((globalAudio.duration || 0) * 1000) || 0;
            const progress = isCurrent && globalAudio.duration ? (globalAudio.currentTime / globalAudio.duration) * 100 : 0;

            return `
                <div class="audio-player" data-card-id="${card.card_id}">
                    <button class="audio-play-btn js-audio-play ${isPlaying ? 'playing' : ''}" data-card-id="${card.card_id}" data-audio-url="${audio.url}" aria-label="播放音频">
                        <span>${isPlaying ? '⏸' : '▶'}</span>
                    </button>
                    <div class="audio-info">
                        <div class="audio-duration">听音频后作答${totalMs ? ` · ${formatDuration(totalMs)}` : ''}</div>
                        <div class="audio-progress" data-card-id="${card.card_id}">
                            <div class="audio-progress-bar js-audio-bar" style="width: ${progress}%"></div>
                        </div>
                        <div class="audio-time">
                            <span class="js-audio-current">${formatDuration(currentMs)}</span>
                            <span class="js-audio-duration">${formatDuration(totalMs)}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderFeedbackButtons() {
            return `
                <div class="feedback-buttons">
                    <button class="fb-btn">⭐ 熟练</button>
                    <button class="fb-btn">📚 会</button>
                    <button class="fb-btn">❓ 待定</button>
                    <button class="fb-btn">❌ 不会</button>
                </div>
            `;
        }

        function isTranslationCard(card) {
            return !!card && Number(card.library) === 4;
        }

        function getPeekHint(card) {
            const back = (card && card.back_content) || {};
            const explanation = (back.explanation || '').trim();
            const answer = (back.text || '').trim();
            if (explanation) {
                return explanation.length > 140 ? `${explanation.slice(0, 140)}...` : explanation;
            }
            if (answer) {
                return answer.length > 120 ? `${answer.slice(0, 120)}...` : answer;
            }
            return '先写出你的英文主干，再检查并列连接词是否对齐。';
        }

        function renderPeekToggleButton(card) {
            if (!isTranslationCard(card)) return '';
            return `<button class="peek-btn js-peek-toggle" type="button">${cardState.peekOpen ? '收起偷看' : '偷看提示'}</button>`;
        }

        function renderPeekPanel(card) {
            if (!isTranslationCard(card) || !cardState.peekOpen) return '';
            return `
                <div class="peek-panel">
                    <strong>偷看提示（不计分）</strong><br>
                    ${escapeHtml(getPeekHint(card)).replace(/\n/g, '<br>')}<br>
                    先完成你的汉译英版本，再翻面核对完整译文。
                </div>
            `;
        }

        function togglePeek() {
            cardState.peekOpen = !cardState.peekOpen;
            renderCard();
        }

        function renderFrontGuidePanel(card) {
            if (!card) return '';
            const schema = ((card.front_content || {}).task_schema) || {};
            const lines = [];
            if (schema.action) lines.push(`动作：${schema.action}`);
            if (schema.focus) lines.push(`焦点：${schema.focus}`);
            if (schema.success_criteria) lines.push(`达标：${schema.success_criteria}`);

            if (!lines.length) return '';

            const body = [
                `<div class="card-front-text" style="margin-bottom: 0; font-size: 13px; line-height: 1.7;">${escapeHtml(lines.join(' | '))}</div>`
            ].join('');

            return `
                <div class="front-panel context">
                    <div class="front-panel-label">作答引导</div>
                    ${body}
                </div>
            `;
        }

        function renderBackReviewPanel(card) {
            const analysis = (card && card.analysis_content) || {};
            const text = (analysis.text || '').trim();
            const tips = Array.isArray(analysis.tips) ? analysis.tips.filter(Boolean) : [];
            if (!text && !tips.length) return '';

            const sections = text.split(/\n\n+/).map(s => s.trim()).filter(Boolean);
            const core = sections[0] || text;
            const rest = sections.slice(1).join('\n\n');
            const coreTip = tips[0] ? `<div class="card-explanation" style="margin-top: 8px; font-size: 13px; line-height: 1.7;">复盘提示：${escapeHtml(tips[0])}</div>` : '';

            const detailText = rest
                ? `<div class="analysis-content" style="margin-top: 6px;">${escapeHtml(rest).replace(/\n/g, '<br>')}</div>`
                : '';
            const extraTips = tips.slice(1);
            const extraTipsHtml = extraTips.length
                ? `<div class="card-explanation" style="margin-top: 8px; font-size: 13px; line-height: 1.7;">更多提示：${escapeHtml(extraTips.join('；'))}</div>`
                : '';
            const details = (detailText || extraTipsHtml)
                ? renderAdaptiveBlock('展开完整复盘', `
                    <div class="analysis-section" style="margin-top: 8px; padding: 12px;">
                        ${detailText}
                        ${extraTipsHtml}
                    </div>
                `)
                : '';

            return `
                <div class="analysis-section" style="margin-top: 10px; padding: 12px;">
                    <div class="analysis-title">知识点复盘</div>
                    <div class="analysis-content">${escapeHtml(core).replace(/\n/g, '<br>')}</div>
                    ${coreTip}
                </div>
                ${details}
            `;
        }

        function renderFrontPanels(front, card = null) {
            const isAudioFirst = !!(front && (front.audio_first === true || front.display_mode === 'audio_first'));
            if (isAudioFirst) {
                const taskPrompt = ((front && front.task_prompt) || (front && front.text) || '请先播放音频并完成任务').trim();
                const taskHtmlOnly = escapeHtml(taskPrompt).replace(/\n/g, '<br>');
                return `
                    <div class="front-block">
                        ${card ? renderAudioPlayer(card) : ''}
                        ${renderFrontGuidePanel(card)}
                        <div class="front-panel task">
                            <div class="front-panel-label">任务 Task</div>
                            <div class="card-front-text" style="margin-bottom: 0; font-size: 15px;">${taskHtmlOnly}</div>
                        </div>
                    </div>
                `;
            }

            const text = (front && front.text) || '';
            const { context, task } = splitFrontText(text);
            const contextHtml = renderContextWithHighlights(context, (front && front.highlight_ranges) || []);
            const taskHtml = task ? escapeHtml(task).replace(/\n/g, '<br>') : '（未显式提供任务提示）';
            const mobile = isMobileViewport();

            const contextPanel = mobile
                ? `
                    <details class="adaptive-details front-context-details">
                        <summary>语境 Context</summary>
                        <div class="adaptive-body">
                            <div class="card-front-text" style="margin-bottom: 0;">${contextHtml}</div>
                        </div>
                    </details>
                `
                : `
                    <div class="front-panel context">
                        <div class="front-panel-label">语境 Context</div>
                        <div class="card-front-text" style="margin-bottom: 0;">${contextHtml}</div>
                    </div>
                `;

            return `
                <div class="front-block">
                    ${contextPanel}
                    <div class="front-panel task">
                        <div class="front-panel-label">任务 Task</div>
                        <div class="card-front-text" style="margin-bottom: 0; font-size: 15px;">${taskHtml}</div>
                    </div>
                </div>
            `;
        }

        function attachInteractionListeners(card, type) {
            // Since innerHTML replaces the entire DOM, all previous listeners are destroyed
            // We just need to attach new listeners to the new elements

            // Attach flip button event
            const flipBtn = document.querySelector('.flip-btn');
            if (flipBtn) {
                flipBtn.addEventListener('click', toggleFlip);
            }

            const peekBtn = document.querySelector('.js-peek-toggle');
            if (peekBtn) {
                peekBtn.addEventListener('click', togglePeek);
            }

            // Attach feedback button events
            const feedbackButtons = document.querySelectorAll('.fb-btn');
            feedbackButtons.forEach((btn) => {
                btn.addEventListener('click', recordFeedback);
            });

            // Attach option selection events for T1
            if (type === 1) {
                const optionBtns = document.querySelectorAll('.option-btn');
                optionBtns.forEach((btn, i) => {
                    btn.addEventListener('click', function() {
                        const isCorrect = card.options[i].is_correct;
                        selectOption(btn, i, isCorrect);
                    });
                });
            }

            if (type === 2) {
                const timingBtn = document.querySelector('.timing-click-btn');
                if (timingBtn) {
                    timingBtn.removeEventListener('click', toggleFlip);
                    timingBtn.addEventListener('click', recordT2Click);
                }
            }

            if (type === 3) {
                const holdBtn = document.querySelector('.hold-release-btn');
                if (holdBtn) {
                    holdBtn.removeEventListener('click', toggleFlip);
                    holdBtn.addEventListener('pointerdown', startT3Hold);
                    holdBtn.addEventListener('pointerup', finishT3Hold);
                    holdBtn.addEventListener('pointercancel', finishT3Hold);
                    holdBtn.addEventListener('keydown', (event) => {
                        if (event.code === 'Space' || event.code === 'Enter') startT3Hold();
                    });
                    holdBtn.addEventListener('keyup', (event) => {
                        if (event.code === 'Space' || event.code === 'Enter') finishT3Hold();
                    });
                }
            }

            // Attach eliminate item events for T4
            if (type === 4) {
                const eliminableItems = document.querySelectorAll('.eliminable-item');
                eliminableItems.forEach((item) => {
                    item.addEventListener('click', function() {
                        toggleEliminate(item);
                    });
                });
                // Override flip button to reveal results first
                if (flipBtn) {
                    flipBtn.removeEventListener('click', toggleFlip);
                    flipBtn.addEventListener('click', checkAndFlipT4);
                }
            }

            if (type === 5) {
                const hintBtn = document.querySelector('.js-hint-toggle');
                if (hintBtn) {
                    hintBtn.addEventListener('click', toggleHintLayer);
                }
            }

            // Attach True/False response events for T7
            if (type === 7) {
                const swipeBtns = document.querySelectorAll('.swipe-btn');
                swipeBtns.forEach((btn) => {
                    const answer = btn.classList.contains('true');
                    btn.addEventListener('click', function() {
                        respondT7(answer);
                    });
                });
            }

            if (type === 6) {
                const wordBtns = document.querySelectorAll('.word-bank-btn');
                wordBtns.forEach((btn) => {
                    btn.addEventListener('click', function() {
                        const index = Number(btn.dataset.wordIndex);
                        const word = Array.isArray(card.word_bank) ? card.word_bank[index] : undefined;
                        if (typeof word === 'string') {
                            selectT6Word(word);
                        }
                    });
                });

                const resetBtn = document.querySelector('.t6-reset-btn');
                if (resetBtn) {
                    resetBtn.addEventListener('click', resetT6);
                }
            }

            if (type === 8) {
                const formBtns = document.querySelectorAll('.t8-option-btn');
                formBtns.forEach((btn) => {
                    btn.addEventListener('click', function() {
                        const index = Number(btn.dataset.formIndex);
                        const option = Array.isArray(card.form_options) ? card.form_options[index] : null;
                        if (option) {
                            selectT8Option(btn, index, !!option.is_correct);
                        }
                    });
                });
            }
        }

        function recordFeedback(e) {
            const text = e.target.textContent.trim();
            console.log('Feedback recorded:', text);
            alert(`✓ 反馈已记录: ${text}`);
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown' && filteredCards.length > 0) {
                selectCard((currentCardIdx + 1) % filteredCards.length);
            } else if (e.key === 'ArrowUp' && filteredCards.length > 0) {
                selectCard((currentCardIdx - 1 + filteredCards.length) % filteredCards.length);
            }
        });

        // 格式化时长
        function formatDuration(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // 全局音频
        let globalAudio = new Audio();
        let currentAudioCardId = null;

        function syncAudioUi() {
            const player = currentAudioCardId
                ? document.querySelector(`.audio-player[data-card-id="${currentAudioCardId}"]`)
                : null;

            document.querySelectorAll('.js-audio-play').forEach((btn) => {
                const isCurrent = btn.dataset.cardId === currentAudioCardId;
                const icon = btn.querySelector('span');
                btn.classList.toggle('playing', isCurrent && !globalAudio.paused);
                if (icon) icon.textContent = isCurrent && !globalAudio.paused ? '⏸' : '▶';
            });

            document.querySelectorAll('.js-audio-bar').forEach((bar) => {
                bar.style.width = '0%';
            });

            document.querySelectorAll('.js-audio-current').forEach((node) => {
                node.textContent = '0:00';
            });

            if (!player) return;

            const bar = player.querySelector('.js-audio-bar');
            const current = player.querySelector('.js-audio-current');
            const duration = player.querySelector('.js-audio-duration');
            if (bar && globalAudio.duration) {
                bar.style.width = `${(globalAudio.currentTime / globalAudio.duration) * 100}%`;
            }
            if (current) {
                current.textContent = formatDuration(Math.floor((globalAudio.currentTime || 0) * 1000));
            }
            if (duration && globalAudio.duration) {
                duration.textContent = formatDuration(Math.floor(globalAudio.duration * 1000));
            }
        }

        globalAudio.addEventListener('play', syncAudioUi);
        globalAudio.addEventListener('pause', syncAudioUi);
        globalAudio.addEventListener('ended', () => {
            syncAudioUi();
        });
        globalAudio.addEventListener('loadedmetadata', syncAudioUi);
        globalAudio.addEventListener('timeupdate', syncAudioUi);

        // 音频播放
        document.addEventListener('click', (e) => {
            const playBtn = e.target.closest('.js-audio-play');
            if (playBtn) {
                const audioUrl = playBtn.dataset.audioUrl;
                const cardId = playBtn.dataset.cardId;
                if (!audioUrl || !cardId) {
                    alert('❌ 音频路径错误');
                    return;
                }

                if (currentAudioCardId !== cardId) {
                    globalAudio.pause();
                    globalAudio.src = audioUrl;
                    currentAudioCardId = cardId;
                    globalAudio.currentTime = 0;
                    globalAudio.play().catch(() => {
                        alert(`❌ 音频播放失败\n${audioUrl}`);
                    });
                    return;
                }

                if (globalAudio.paused) {
                    globalAudio.play().catch(() => {
                        alert(`❌ 音频播放失败\n${audioUrl}`);
                    });
                } else {
                    globalAudio.pause();
                }
                return;
            }

            const progressDiv = e.target.closest('.audio-progress');
            if (progressDiv && globalAudio.duration) {
                const cardId = progressDiv.dataset.cardId;
                if (cardId !== currentAudioCardId) return;
                const rect = progressDiv.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                globalAudio.currentTime = Math.max(0, Math.min(percent * globalAudio.duration, globalAudio.duration));
                syncAudioUi();
            }
        });

        // Paste support
        window.addEventListener('paste', (e) => {
            const text = e.clipboardData.getData('text/plain');
            try {
                const data = JSON.parse(text);
                allCards = normalizeCards(data);
                loadCards();
            } catch {}
        });

        function applyLoadedData(data) {
            allCards = normalizeCards(data);
            filteredCards = [...allCards];
            loadCards();
        }

        // Auto-load cards on page load.
        // Pure HTML mode (file://) intentionally does not inject built-in samples.
        // Please use file picker or paste JSON content in this mode.
        window.addEventListener('DOMContentLoaded', async () => {
            if (window.location.protocol === 'file:') {
            console.log('纯 HTML 模式：请点击“选择JSON文件”或直接粘贴 JSON 数据。');
                return;
            }

            try {
                const response = await fetch('./card_boxes_json/card_boxes_seed_cet4_listening_0020.json');
                if (response.ok) {
                    const data = await response.json();
                    applyLoadedData(data);
                    return;
                }
            } catch (err) {
                console.log('自动加载失败，可手动上传或粘贴卡片数据');
            }
        });
    </script>
</body>
</html>
